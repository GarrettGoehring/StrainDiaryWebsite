name: Sync CloudKit public content

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-cloudkit-strains.yml'
      - 'scripts/sync-cloudkit-strains.mjs'
      - 'scripts/sync-cloudkit-education.mjs'
      - 'strain-library-bundled.json'

permissions:
  contents: write

concurrency:
  group: cloudkit-public-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDKIT_CONTAINER: iCloud.Gary.Strain-Diary-optimized
      CLOUDKIT_ENVIRONMENT: production
      CLOUDKIT_KEY_ID: 69ad0d8df32f03c03ca4dd7de0690b727f7157c5fb2b86bc341f7904ef1add4c
      CLOUDKIT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CloudKit key pair
        run: |
          node -e 'const c=require("node:crypto");let s=process.env.CLOUDKIT_PRIVATE_KEY.replace(/\\n/g,"\n").trim();if(!s.includes("BEGIN")){const b=s.replace(/\s/g,"");s="-----BEGIN EC PRIVATE KEY-----\n"+b.match(/.{1,64}/g).join("\n")+"\n-----END EC PRIVATE KEY-----"}const k=c.createPrivateKey(s);const der=c.createPublicKey(k).export({type:"spki",format:"der"});const fp=c.createHash("sha256").update(der).digest("hex");console.log("Derived public-key SHA-256:",fp);if(fp!=="4f10199caa4d3b2ba7133bfc8374c4e5ea506539b7a689525171751d15a80b63")throw new Error("GitHub private key does not match the public key registered in CloudKit")'
      - name: Build public strain catalog
        run: node scripts/sync-cloudkit-strains.mjs
      - name: Build public education pages
        run: node scripts/sync-cloudkit-education.mjs
      - name: Commit public content changes
        run: |
          if git diff --quiet -- strain-library.json strain-library-meta.json global-shared-strains.json education.html education-posts.json education sitemap.xml; then
            echo "Public content is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strain-library.json strain-library-meta.json global-shared-strains.json education.html education-posts.json education sitemap.xml
          git commit -m "Update public content from CloudKit"
          git push
