<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Live Competition | Strain Diary</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/footer.css">
  <style>
    :root {
      --bg: #07110d;
      --panel: rgba(18, 34, 27, 0.9);
      --panel-2: rgba(28, 49, 40, 0.88);
      --line: rgba(191, 255, 211, 0.17);
      --text: #f4fff7;
      --muted: #a9beb0;
      --green: #80f0a6;
      --green-2: #38ba6d;
      --gold: #f4c95d;
      --silver: #c9d2dc;
      --bronze: #d58a5d;
      --accent-hue: 145;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: Figtree, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 15% 0%, hsl(var(--accent-hue) 55% 30% / 0.24), transparent 35%),
        radial-gradient(circle at 92% 100%, hsl(var(--accent-hue) 45% 26% / 0.18), transparent 36%),
        var(--bg);
    }

    #app {
      position: relative;
      width: 100vw;
      min-height: 100dvh;
      padding: clamp(22px, 2.2vw, 44px);
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 1.6vw, 30px);
      isolation: isolate;
    }

    .photo-banner {
      position: absolute;
      z-index: -1;
      inset: 0 0 auto 0;
      width: 100%;
      height: 42vh;
      object-fit: cover;
      filter: brightness(.72) saturate(1.15);
      opacity: 0;
      transition: opacity 500ms ease;
      -webkit-mask-image: linear-gradient(to bottom, #000 25%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 25%, transparent 100%);
    }

    .photo-banner.ready { opacity: 0.52; }

    .topbar {
      min-height: 12vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 24px;
    }

    .eyebrow {
      margin: 0 0 0.35em;
      color: var(--green);
      font-size: clamp(0.78rem, 1.05vw, 1.2rem);
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 76vw;
      margin: 0;
      font-size: clamp(2.35rem, 4.7vw, 5.8rem);
      line-height: 0.98;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .end-label { margin: .55em 0 0; color: var(--green); font-size: clamp(.95rem, 1.25vw, 1.45rem); font-weight: 750; }
    .end-countdown { display: inline-block; margin-left: .55em; color: var(--text); font-variant-numeric: tabular-nums; }

    .host {
      margin: 0.45em 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.55vw, 1.85rem);
      font-weight: 650;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      min-width: 210px;
      color: var(--muted);
      font-size: clamp(0.82rem, 1vw, 1.05rem);
      font-weight: 700;
      white-space: nowrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(128, 240, 166, 0.1);
    }

    .status.reconnecting .status-dot {
      background: var(--gold);
      animation: breathe 1.5s ease-in-out infinite;
    }

    @keyframes breathe { 50% { opacity: 0.35; } }

    .top-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }

    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(20px, 3vw, 54px);
      padding: clamp(18px, 1.7vw, 28px) clamp(20px, 2.1vw, 38px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: hsl(var(--accent-hue) 30% 9% / .78);
      backdrop-filter: blur(18px);
    }

    .summary-labels {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 12px;
      font-weight: 750;
    }

    .summary-labels strong { font-size: clamp(1.15rem, 1.7vw, 2rem); }
    .summary-labels span { color: var(--muted); font-size: clamp(0.9rem, 1.15vw, 1.25rem); }

    .track, .entry-track {
      overflow: hidden;
      width: 100%;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.085);
    }

    .track { height: clamp(14px, 1.25vw, 22px); }
    .entry-track { height: clamp(9px, 0.8vw, 14px); }

    .fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--green-2), var(--green));
      transition: width 450ms ease;
    }

    .judge-stat {
      min-width: 160px;
      text-align: right;
    }

    .judge-stat strong {
      display: block;
      font-size: clamp(2.1rem, 3.6vw, 4.3rem);
      line-height: 0.9;
    }

    .judge-stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: clamp(0.9rem, 1.1vw, 1.2rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .content {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin: 0 0 clamp(12px, 1.2vw, 20px);
    }

    .section-heading h2 {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 2.4rem);
      letter-spacing: -0.03em;
    }

    .category-tabs { display: flex; gap: 8px; max-width: 65vw; overflow-x: auto; scrollbar-width: thin; }
    .category-tab { flex: none; padding: .45em .8em; border: 1px solid var(--line); border-radius: 999px; background: rgba(128, 240, 166, .07); color: var(--muted); font: inherit; font-size: clamp(.85rem, 1vw, 1.1rem); font-weight: 800; cursor: pointer; }
    .category-tab[aria-pressed="true"] { color: var(--bg); background: var(--green); border-color: var(--green); }
    .category-tab:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

    .pill {
      padding: 0.45em 0.8em;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--green);
      background: rgba(128, 240, 166, 0.07);
      font-size: clamp(0.76rem, 0.95vw, 1rem);
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .category-groups { min-height: 0; flex: 1; display: grid; grid-template-rows: repeat(var(--group-count), minmax(max-content, 1fr)); gap: clamp(8px, .9vw, 16px); }
    .category-group { min-height: 0; display: flex; flex-direction: column; }
    .category-heading { margin: 0 0 8px; color: var(--green); font-size: clamp(1rem, 1.35vw, 1.5rem); }

    .entry-grid {
      --cols: 4;
      --rows: 2;
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      grid-template-rows: repeat(var(--rows), minmax(96px, 1fr));
      gap: clamp(10px, 1.1vw, 20px);
    }

    .entry-card {
      min-width: 0;
      min-height: 0;
      padding: clamp(14px, 1.4vw, 24px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: clamp(16px, 1.5vw, 24px);
      background: linear-gradient(145deg, var(--panel-2), var(--panel));
    }

    .entry-card.just-reviewed {
      position: relative;
      z-index: 1;
      border-color: rgba(128, 240, 166, 0.8);
      box-shadow: 0 0 0 2px rgba(128, 240, 166, 0.18), 0 0 36px rgba(56, 186, 109, 0.22);
      animation: review-pop 900ms cubic-bezier(.2, 1.5, .4, 1), review-glow 2.2s ease-out 2;
    }

    .entry-card.just-reviewed::after {
      content: "✦  ✧  ✦";
      position: absolute;
      top: -20px;
      right: 12px;
      color: var(--green);
      font-size: clamp(1.4rem, 2.1vw, 2.6rem);
      letter-spacing: .2em;
      text-shadow: 0 0 18px rgba(128, 240, 166, .75);
      pointer-events: none;
      animation: review-sparkle 1.8s ease-out both;
    }

    .entry-card.just-reviewed .entry-track .fill {
      background: linear-gradient(90deg, var(--green-2), #e1ffb7, var(--green-2));
      background-size: 200% 100%;
      animation: review-shimmer 1.4s ease-in-out 2;
    }

    @keyframes review-pop {
      0% { transform: scale(.94); }
      45% { transform: scale(1.035); }
      100% { transform: scale(1); }
    }
    @keyframes review-glow {
      50% { box-shadow: 0 0 0 5px rgba(128, 240, 166, .28), 0 0 70px rgba(56, 186, 109, .38); }
    }
    @keyframes review-sparkle {
      0% { opacity: 0; transform: translateY(18px) scale(.6); }
      30% { opacity: 1; transform: translateY(-8px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-28px) scale(.9); }
    }
    @keyframes review-shimmer {
      from { background-position: 100% 0; }
      to { background-position: -100% 0; }
    }

    .activity-toast {
      position: absolute;
      z-index: 2;
      left: clamp(22px, 2.2vw, 44px);
      bottom: clamp(20px, 2vw, 36px);
      max-width: min(70vw, 540px);
      padding: 14px 22px;
      border: 1px solid rgba(128, 240, 166, 0.6);
      border-radius: 18px;
      background: #193a29;
      color: var(--text);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
      font-size: clamp(1rem, 1.5vw, 1.6rem);
      font-weight: 800;
      animation: activity-appear 650ms cubic-bezier(.2, 1.3, .4, 1) both;
    }

    @keyframes activity-appear {
      from { opacity: 0; transform: translateY(22px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .entry-title {
      overflow: hidden;
      margin: 0;
      font-size: clamp(1.05rem, 1.7vw, 2rem);
      line-height: 1.08;
      letter-spacing: -0.03em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-name {
      overflow: hidden;
      margin: 0.35em 0 0;
      color: var(--muted);
      font-size: clamp(0.78rem, 1vw, 1.1rem);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-count {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: clamp(0.78rem, 1vw, 1.05rem);
      font-weight: 750;
    }

    .leaderboard {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-rows: repeat(var(--leader-rows, 10), minmax(76px, 1fr));
      gap: clamp(5px, 0.55vw, 10px);
    }

    .leader-row {
      width: 100%;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      min-height: 0;
      display: grid;
      grid-template-columns: clamp(52px, 5vw, 92px) minmax(0, 1fr) auto minmax(95px, 10vw);
      align-items: center;
      gap: clamp(14px, 2vw, 34px);
      padding: 0 clamp(16px, 1.8vw, 30px);
      border: 1px solid var(--line);
      border-radius: clamp(12px, 1vw, 18px);
      background: linear-gradient(90deg, hsl(var(--accent-hue) 30% 17% / .93), hsl(var(--accent-hue) 29% 9% / .82));
    }

    .leader-row:hover, .leader-row:focus-visible { border-color: var(--green); outline: 2px solid transparent; background-color: rgba(128, 240, 166, 0.08); }

    .leader-row.gold { border-color: rgba(244, 201, 93, 0.52); background: linear-gradient(90deg, rgba(102, 78, 21, 0.48), rgba(35, 33, 21, 0.85)); }
    .leader-row.silver { border-color: rgba(201, 210, 220, 0.45); background: linear-gradient(90deg, rgba(79, 90, 101, 0.42), rgba(26, 32, 31, 0.86)); }
    .leader-row.bronze { border-color: rgba(213, 138, 93, 0.45); background: linear-gradient(90deg, rgba(95, 52, 32, 0.44), rgba(33, 28, 24, 0.86)); }

    .rank {
      font-size: clamp(1.25rem, 2vw, 2.4rem);
      font-weight: 900;
      text-align: center;
    }

    .gold .rank { color: var(--gold); }
    .silver .rank { color: var(--silver); }
    .bronze .rank { color: var(--bronze); }

    .leader-main { min-width: 0; align-self: center; }
    .leader-main strong {
      display: block;
      overflow: hidden;
      font-size: clamp(1rem, 1.55vw, 1.8rem);
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leader-main span {
      display: block;
      overflow: hidden;
      margin-top: 0.2em;
      color: var(--muted);
      font-size: clamp(0.7rem, 0.9vw, 1rem);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score { text-align: right; white-space: nowrap; }
    .score strong {
      display: block;
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.45rem, 2.35vw, 2.8rem);
      line-height: 0.95;
    }
    .judge-count { color: var(--muted); font-size: clamp(0.8rem, 1vw, 1.1rem); font-weight: 700; text-align: right; white-space: nowrap; }

    .confetti-field { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .confetti-piece { position: absolute; top: -25px; width: var(--size); height: calc(var(--size) * 1.6); background: var(--color); opacity: 0; animation: confetti-fall var(--duration) ease-in var(--delay) forwards; }
    @keyframes confetti-fall { 0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(0); } 8% { opacity: 1; } 100% { opacity: 0; transform: translate3d(var(--drift), 105vh, 0) rotate(var(--spin)); } }
    .ceremony-slide .ceremony-kicker { animation: ceremony-text .55s ease-out both; }
    .ceremony-slide .ceremony-title { animation: ceremony-text .7s .15s cubic-bezier(.15,.85,.2,1) both; }
    .ceremony-slide .ceremony-entry { animation: ceremony-text .7s .4s cubic-bezier(.15,.85,.2,1) both; }
    .ceremony-slide .ceremony-name { animation: ceremony-text .7s .6s cubic-bezier(.15,.85,.2,1) both; }
    .ceremony-slide .ceremony-score { animation: ceremony-text .6s .8s ease-out both; }
    @keyframes ceremony-text { from { opacity: 0; transform: translateY(28px) scale(.94); filter: blur(7px); } to { opacity: 1; transform: none; filter: blur(0); } }
    @media (prefers-reduced-motion: reduce) { .confetti-piece { display: none; } }
    .ceremony-wait { flex: 1; display: grid; place-items: center; text-align: center; gap: 22px; padding: 4vh 16px; }
    .ceremony-wait h2 { margin: 0; font-size: clamp(2.5rem, 5vw, 5rem); }
    .ceremony-wait p { color: var(--muted); font-size: clamp(1.1rem, 1.6vw, 1.8rem); }
    .display-button { border: 1px solid var(--line); border-radius: 999px; padding: .45em .8em; background: var(--panel); color: var(--text); font: inherit; font-weight: 750; cursor: pointer; }
    .settings-layer[hidden] { display: none; }
    .settings-layer { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(0,0,0,.7); }
    .settings-panel { width: min(480px, 100%); padding: 28px; border: 1px solid var(--line); border-radius: 24px; background: #14271c; box-shadow: 0 20px 60px #0008; }
    .settings-panel h2 { margin: 0 0 18px; font-size: 2rem; }
    .settings-panel label { display: flex; justify-content: space-between; gap: 20px; padding: 13px 0; font-size: 1.1rem; }
    .settings-panel input { width: 24px; height: 24px; accent-color: var(--green); }
    .settings-panel button { margin-top: 20px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 18px; background: var(--panel-2); color: var(--text); font: inherit; cursor: pointer; }
    html.compact-live .leader-row { min-height: 60px; }
    html.compact-live .entry-card { padding: 10px; }
    html.large-live #app { font-size: 1.2em; }
    html.large-live .leader-main strong, html.large-live .entry-title { font-size: clamp(1.3rem, 2vw, 2.3rem); }
    html.no-live-photo .photo-banner { display: none; }
    .ceremony-layer[hidden] { display: none; }
    .ceremony-layer { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: clamp(16px, 3vw, 48px); background: radial-gradient(circle at 50% 35%, hsl(var(--accent-hue) 45% 20%), #040b07 75%); color: var(--text); }
    .ceremony-panel { width: min(1100px, 100%); text-align: center; }
    .ceremony-kicker { color: var(--green); font-size: clamp(1rem, 1.6vw, 1.6rem); font-weight: 900; letter-spacing: .18em; text-transform: uppercase; }
    .ceremony-title { margin: .25em 0; font-size: clamp(3rem, 7vw, 8rem); line-height: 1; text-wrap: balance; }
    .ceremony-entry { margin: .2em 0; font-size: clamp(2rem, 4vw, 4rem); font-weight: 800; }
    .ceremony-name { margin: .25em 0; color: var(--green); font-size: clamp(1.5rem, 3vw, 3rem); font-weight: 750; }
    .ceremony-score { color: var(--muted); font-size: clamp(1.2rem, 2vw, 2rem); }
    .ceremony-controls { position: absolute; bottom: clamp(20px, 3vw, 48px); left: 0; right: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 0 16px; }
    .ceremony-controls button, .ceremony-start { border: 1px solid var(--line); border-radius: 999px; padding: .65em 1em; background: var(--panel-2); color: var(--text); font: inherit; font-size: clamp(.9rem, 1.2vw, 1.25rem); font-weight: 800; cursor: pointer; }
    .ceremony-controls button:disabled { opacity: .4; cursor: default; }
    .ceremony-start { background: var(--green); color: var(--bg); }
    .ceremony-slide { animation: ceremony-reveal .65s ease-out both; }
    .ceremony-slide.gold .ceremony-title { color: var(--gold); }
    .ceremony-slide.silver .ceremony-title { color: var(--silver); }
    .ceremony-slide.bronze .ceremony-title { color: var(--bronze); }
    @keyframes ceremony-reveal { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: none; } }

    .detail-layer[hidden] { display: none; }
    .detail-layer { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 3vw; background: rgba(1, 9, 5, .8); backdrop-filter: blur(12px); }
    .detail-panel { width: min(1100px, 94vw); max-height: 90dvh; overflow: auto; padding: clamp(22px, 2.8vw, 44px); border: 1px solid var(--line); border-radius: 26px; background: #12251b; box-shadow: 0 28px 100px rgba(0, 0, 0, .6); }
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .detail-head h2 { margin: 0; font-size: clamp(2rem, 3.5vw, 4rem); line-height: 1.05; }
    .detail-head p { color: var(--muted); font-size: clamp(1rem, 1.4vw, 1.5rem); }
    .detail-close { border: 1px solid var(--line); border-radius: 12px; padding: .5em .8em; color: var(--text); background: var(--panel-2); font: inherit; font-size: 1.3rem; cursor: pointer; }
    .detail-summary { display: flex; gap: 30px; align-items: baseline; padding: 16px 0; color: var(--muted); font-size: clamp(1rem, 1.4vw, 1.5rem); }
    .detail-summary strong { color: var(--green); font-size: clamp(2.5rem, 4vw, 4.5rem); }
    .detail-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(20px, 3vw, 50px); }
    .detail-columns h3 { font-size: clamp(1.3rem, 2vw, 2.2rem); margin: 0 0 18px; }
    .detail-metric { margin: 0 0 18px; }
    .detail-metric-line { display: flex; justify-content: space-between; gap: 15px; font-size: clamp(1rem, 1.35vw, 1.45rem); font-weight: 700; }
    .detail-metric-line span { overflow: hidden; text-overflow: ellipsis; }
    .detail-metric-line strong { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .detail-metric small { display: block; margin-top: 5px; color: var(--muted); font-size: .9rem; }
    .detail-metric .entry-track { margin-top: 9px; height: 12px; }
    .detail-empty { color: var(--muted); font-size: 1.1rem; }
    @media (max-width: 750px) { .detail-columns { grid-template-columns: 1fr; } .detail-panel { max-height: 94dvh; } }

    .join {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 10px 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(6, 15, 11, 0.88);
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.28);
    }

    .join strong { display: block; font-size: clamp(0.8rem, 0.95vw, 1.05rem); }
    .join span { display: block; color: var(--muted); font-size: clamp(0.62rem, 0.7vw, 0.78rem); }
    #qr { width: 76px; height: 76px; padding: 5px; border-radius: 8px; background: #fff; }
    #qr img, #qr canvas { width: 100% !important; height: 100% !important; }

    .empty-screen {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .empty-screen h1 { max-width: none; font-size: clamp(3rem, 7vw, 8rem); }
    .empty-screen p { margin: 1em 0 0; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.8rem); }

    @media (max-width: 750px) {
      .section-heading { align-items: stretch; flex-direction: column; gap: 12px; }
      .category-tabs { max-width: 100%; width: 100%; }
      html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
      #app { height: auto; min-height: 100dvh; }
      .content, .leaderboard, .category-groups, .entry-grid { flex: none; }
      .leaderboard, .category-groups, .entry-grid { grid-template-rows: none; grid-auto-rows: auto; }
      .leader-row { min-height: 84px; }
      .detail-layer { overflow-y: auto; align-items: start; }
      .detail-panel { max-height: 90dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    }

    @media (max-aspect-ratio: 4/3) {
      .join { display: none; }
      h1 { max-width: 88vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="empty-screen"><div><p class="eyebrow">Strain Diary Live</p><h1>Loading competition…</h1></div></div>
  </main>
  <div id="settings-layer" class="settings-layer" hidden role="presentation"><section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title"><h2 id="settings-title">Display settings</h2><label>Compact entries <input type="checkbox" data-setting="compact"></label><label>Larger text <input type="checkbox" data-setting="large"></label><label>Show cup picture <input type="checkbox" data-setting="photo"></label><button type="button" id="settings-close">Done</button></section></div>
  <div id="ceremony-layer" class="ceremony-layer" hidden role="presentation"><div class="confetti-field" aria-hidden="true"></div><section class="ceremony-panel" role="dialog" aria-modal="true" aria-label="Awards ceremony"></section><div class="ceremony-controls"></div></div>
  <div id="detail-layer" class="detail-layer" hidden role="presentation"><section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title"></section></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (() => {
      "use strict";

      // Replace this with the URL of the separate live-competition Worker.
      const WORKER_URL = "https://straindiary-competition-live.gdgoehring.workers.dev/";
      const REFRESH_MS = 5000;
      const app = document.getElementById("app");
      const code = location.hash.slice(1).toUpperCase();
      let lastGoodData = null;
      let lastGoodAt = 0;
      let reconnecting = false;
      let renderedSignature = "";
      let timer = null;
      let ageTimer = null;
      let activityText = "";
      let activityUntil = 0;
      let recentEntryNumbers = new Set();
      let selectedEntryNumber = null;
      let selectedCategory = null;
      let ceremonyStep = -1;
      let ceremonyFinished = false;
      try { ceremonyFinished = sessionStorage.getItem(`awards-finished:${code}`) === "yes"; } catch {}
      let lastCelebratedStep = -1;
      let ceremonySignature = "";
      const settingsLayer = document.getElementById("settings-layer");
      const displaySettings = { compact: false, large: false, photo: true };
      try { Object.assign(displaySettings, JSON.parse(localStorage.getItem("strain-live-display") || "{}")); } catch {}
      function applyDisplaySettings() {
        document.documentElement.classList.toggle("compact-live", !!displaySettings.compact);
        document.documentElement.classList.toggle("large-live", !!displaySettings.large);
        document.documentElement.classList.toggle("no-live-photo", !displaySettings.photo);
        settingsLayer.querySelectorAll("[data-setting]").forEach(input => { input.checked = !!displaySettings[input.dataset.setting]; });
      }
      applyDisplaySettings();
      settingsLayer.addEventListener("change", event => {
        const key = event.target.dataset.setting;
        if (!(key in displaySettings)) return;
        displaySettings[key] = event.target.checked;
        try { localStorage.setItem("strain-live-display", JSON.stringify(displaySettings)); } catch {}
        applyDisplaySettings();
      });
      settingsLayer.addEventListener("click", event => { if (event.target === settingsLayer || event.target.id === "settings-close") settingsLayer.hidden = true; });
      const ceremonyLayer = document.getElementById("ceremony-layer");
      const ceremonyPanel = ceremonyLayer.querySelector(".ceremony-panel");
      const confettiField = ceremonyLayer.querySelector(".confetti-field");
      const ceremonyControls = ceremonyLayer.querySelector(".ceremony-controls");
      let previousFocus = null;
      const detailLayer = document.getElementById("detail-layer");
      const detailPanel = detailLayer.querySelector(".detail-panel");

      const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      })[character]);

      const entryText = entry => `${entry.category || "Entry"}${entry.catNumber == null ? "" : ` #${entry.catNumber}`}`;
      const entryLabel = entry => escapeHTML(entryText(entry));
      const categoriesInOrder = entries => [...new Set([...entries].sort((a, b) => Number(a.number) - Number(b.number)).map(entry => entry.category || "Entry"))];
      const currentCategory = categories => categories.includes(selectedCategory) ? selectedCategory : categories[0];
      const categoryPicker = categories => categories.length > 1
        ? `<nav class="category-tabs" aria-label="Competition categories">${categories.map(category => `<button type="button" class="category-tab" data-category="${escapeHTML(category)}" aria-pressed="${category === currentCategory(categories)}">${escapeHTML(category)}</button>`).join("")}</nav>`
        : "";
      const hostLabel = data => {
        const username = String(data.hostName || "").trim().replace(/^@+/, "");
        const displayName = String(data.hostDisplayName || "").trim().replace(/^@+/, "");
        if (!displayName) return username ? `Hosted by @${escapeHTML(username)}` : "";
        if (displayName.toLowerCase() === username.toLowerCase()) {
          return `Hosted by @${escapeHTML(displayName)}`;
        }
        return `Hosted by ${escapeHTML(displayName)} (@${escapeHTML(username)})`;
      };
      const percent = (part, whole) => whole > 0 ? Math.max(0, Math.min(100, (part / whole) * 100)) : 0;

      function showNotFound() {
        document.title = "Competition not found | Strain Diary";
        app.innerHTML = `<div class="empty-screen"><div><p class="eyebrow">Strain Diary Live</p><h1>Competition not found</h1><p>Check the competition code and try again.</p></div></div>`;
      }

      function showConnecting() {
        app.innerHTML = `<div class="empty-screen"><div><p class="eyebrow">Strain Diary Live</p><h1>Connecting…</h1><p>Waiting for competition data.</p></div></div>`;
      }

      function gridSize(count) {
        if (count <= 2) return [2, 1];
        if (count <= 4) return [2, 2];
        if (count <= 8) return [4, 2];
        if (count <= 12) return [4, 3];
        if (count <= 20) return [5, 4];
        const cols = Math.ceil(Math.sqrt(count * (16 / 9)));
        return [cols, Math.ceil(count / cols)];
      }

      function statusMarkup() {
        return `<div id="live-status" class="status${reconnecting ? " reconnecting" : ""}">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="updated-label">${reconnecting ? "reconnecting…" : "Updated just now"}</span>
        </div>`;
      }

      function endTimeLabel(value) {
        const end = new Date(value);
        if (!Number.isFinite(end.getTime())) return "";
        const today = end.toDateString() === new Date().toDateString();
        const options = today ? { hour: "numeric", minute: "2-digit" } : { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
        return `Judging ends ${new Intl.DateTimeFormat(undefined, options).format(end)}`;
      }

      function endMarkup(data) {
        if (!data.judgingOpen || !data.judgingEndsAt) return "";
        const label = endTimeLabel(data.judgingEndsAt);
        return label ? `<p class="end-label">${escapeHTML(label)}<span id="end-countdown" class="end-countdown"></span></p>` : "";
      }

      function commonHeader(data) {
        const photo = data.hasPhoto
          ? `<img id="cup-photo" class="photo-banner" alt="Competition cup" crossorigin="anonymous" src="${escapeHTML(WORKER_URL)}?code=${encodeURIComponent(code)}&photo=1">`
          : "";
        return `${photo}<header class="topbar"><div><p class="eyebrow">Strain Diary Live</p><h1>${escapeHTML(data.title)}</h1><p class="host">${hostLabel(data)}</p>${endMarkup(data)}</div><div class="top-right">${statusMarkup()}<button type="button" class="display-button">Display settings</button>${joinMarkup()}</div></header>`;
      }

      function joinMarkup() {
        return `<aside class="join" aria-label="Join this competition to judge"><div><strong>Join to judge</strong><span>straindiary.com/c#${escapeHTML(code)}</span></div><div id="qr" aria-hidden="true"></div></aside>`;
      }

      function renderOpen(data) {
        const submitted = Number(data.progress?.submitted) || 0;
        const possible = Number(data.progress?.possible) || 0;
        const categories = categoriesInOrder(data.entries);
        const visibleCategories = categories.length > 1 ? [currentCategory(categories)] : categories;
        const groups = visibleCategories.map(category => {
          const entries = data.entries.filter(entry => (entry.category || "Entry") === category);
          const [cols, rows] = gridSize(entries.length);
          const cards = entries.map(entry => {
            const ratio = percent(entry.scoredBy, entry.judgeCount);
            const name = data.namesPublic && entry.name ? `<p class="entry-name">${escapeHTML(entry.name)}</p>` : "";
            const recent = Date.now() < activityUntil && recentEntryNumbers.has(String(entry.number));
            return `<article class="entry-card${recent ? " just-reviewed" : ""}"><div><h3 class="entry-title">${entryLabel(entry)}</h3>${name}</div><div><div class="entry-count"><span>Judges scored</span><strong>${escapeHTML(entry.scoredBy)}/${escapeHTML(entry.judgeCount)}</strong></div><div class="entry-track"><div class="fill" style="width:${ratio.toFixed(2)}%"></div></div></div></article>`;
          }).join("");
          return `<section class="category-group" aria-label="${escapeHTML(category)}"><h3 class="category-heading">${escapeHTML(category)}</h3><div class="entry-grid" style="--cols:${cols};--rows:${rows}">${cards}</div></section>`;
        }).join("");

        return `${commonHeader(data)}
          <section class="summary"><div><div class="summary-labels"><strong>Judging progress</strong><span>${submitted} of ${possible} submissions</span></div><div class="track"><div class="fill" style="width:${percent(submitted, possible).toFixed(2)}%"></div></div></div><div class="judge-stat"><strong>${escapeHTML(data.judgeCount)}</strong><span>Judges</span></div></section>
          <section class="content"><div class="section-heading"><h2>Entries</h2>${categoryPicker(categories)}</div><div class="category-groups" style="--group-count:${Math.max(visibleCategories.length, 1)}">${groups}</div></section>
          ${Date.now() < activityUntil ? `<div id="activity-toast" class="activity-toast" role="status">${escapeHTML(activityText)}</div>` : ""}`;
      }

      function renderClosed(data) {
        if (!ceremonyFinished) {
          const available = ceremonySlides(data).length > 0;
          return `${commonHeader(data)}<section class="ceremony-wait"><div><p class="eyebrow">Judging complete</p><h2>Winners are under wraps</h2><p>${available ? "Start the awards ceremony to reveal each category’s winners." : "Results will appear when scorecards are available."}</p>${available ? `<button type="button" class="ceremony-start">Start Awards Ceremony</button>` : ""}</div></section>`;
        }
        const categories = categoriesInOrder(data.entries);
        const category = currentCategory(categories);
        const ranked = data.entries.filter(entry => entry.category === category && typeof entry.total === "number").slice(0, 10);
        const rows = ranked.map((entry, index) => {
          const medal = index === 0 ? " gold" : index === 1 ? " silver" : index === 2 ? " bronze" : "";
          const publicName = data.namesPublic && entry.name ? ` · ${escapeHTML(entry.name)}` : "";
          return `<button type="button" class="leader-row${medal}" data-entry="${escapeHTML(entry.number)}" aria-label="View detailed results for ${entryLabel(entry)}"><div class="rank">${index + 1}</div><div class="leader-main"><strong>${entryLabel(entry)}${publicName}</strong></div><div class="score"><strong>${entry.total.toFixed(1)}</strong></div><div class="judge-count">${escapeHTML(entry.scoredBy)} judge${entry.scoredBy === 1 ? "" : "s"}</div></button>`;
        }).join("");
        const empty = ranked.length ? "" : `<div class="empty-screen"><div><h1>No scores yet</h1><p>Results will appear when scorecards are available.</p></div></div>`;
        const position = `${categoryPicker(categories)}<button type="button" class="ceremony-start">Start Awards Ceremony</button>`;
        return `${commonHeader(data)}<section class="content"><div class="section-heading"><h2>${escapeHTML(category || "Leaderboard")} leaderboard</h2>${position}</div><div class="leaderboard" style="--leader-rows:${Math.max(ranked.length, 1)}">${rows || empty}</div></section>`;
      }

      function ceremonySlides(data) {
        if (!data || data.judgingOpen) return [];
        const slides = [];
        for (const category of categoriesInOrder(data.entries)) {
          const winners = data.entries.filter(entry => entry.category === category && typeof entry.total === "number").slice(0, 3);
          if (!winners.length) continue;
          slides.push({ type: "intro", category });
          winners.map((entry, index) => ({ type: "award", category, entry, place: index + 1 }))
            .reverse().forEach(slide => slides.push(slide));
        }
        if (slides.length) slides.push({ type: "finish" });
        return slides;
      }

      function launchConfetti(place) {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        confettiField.replaceChildren();
        const colors = place === 1 ? ["#f4c95d", "#fff2ac", "#ffffff", "#80f0a6"] : place === 2 ? ["#c9d2dc", "#ffffff", "#80f0a6"] : ["#d58a5d", "#ffd4a3", "#80f0a6"];
        const count = place === 1 ? 100 : 65;
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
          const piece = document.createElement("span");
          piece.className = "confetti-piece";
          piece.style.left = `${Math.random() * 100}%`;
          piece.style.setProperty("--size", `${5 + Math.random() * 9}px`);
          piece.style.setProperty("--color", colors[i % colors.length]);
          piece.style.setProperty("--duration", `${2.1 + Math.random() * 1.4}s`);
          piece.style.setProperty("--delay", `${Math.random() * .45}s`);
          piece.style.setProperty("--drift", `${(Math.random() - .5) * 45}vw`);
          piece.style.setProperty("--spin", `${(Math.random() - .5) * 1200}deg`);
          fragment.appendChild(piece);
        }
        confettiField.appendChild(fragment);
      }

      function renderCeremony() {
        const slides = ceremonySlides(lastGoodData);
        if (ceremonyStep < 0 || !slides.length) { closeCeremony(); return; }
        ceremonyStep = Math.min(ceremonyStep, slides.length - 1);
        const slide = slides[ceremonyStep];
        const signature = JSON.stringify({ step: ceremonyStep, slide, namesPublic: lastGoodData.namesPublic });
        if (signature === ceremonySignature && !ceremonyLayer.hidden) return;
        ceremonySignature = signature;
        const medal = slide.place === 1 ? "gold" : slide.place === 2 ? "silver" : slide.place === 3 ? "bronze" : "";
        const placeName = slide.place === 1 ? "First place" : slide.place === 2 ? "Second place" : "Third place";
        const title = slide.type === "intro" ? escapeHTML(slide.category) : slide.type === "finish" ? "Congratulations!" : placeName;
        const entry = slide.entry;
        const name = entry && lastGoodData.namesPublic && entry.name ? `<p class="ceremony-name">${escapeHTML(entry.name)}</p>` : "";
        ceremonyPanel.innerHTML = `<div class="ceremony-slide ${medal}" key="${ceremonyStep}"><p class="ceremony-kicker">Strain Diary Awards · ${ceremonyStep + 1} of ${slides.length}</p><h2 class="ceremony-title">${title}</h2>${entry ? `<p class="ceremony-entry">${entryLabel(entry)}</p>${name}<p class="ceremony-score">${entry.total.toFixed(1)} / 10 · ${escapeHTML(entry.scoredBy)} judges</p>` : `<p class="ceremony-entry">${slide.type === "intro" ? "Ready to reveal the winners?" : "Thanks to everyone who judged."}</p>`}</div>`;
        ceremonyControls.innerHTML = `<button type="button" data-ceremony="exit">Exit ceremony</button><button type="button" data-ceremony="previous" ${ceremonyStep === 0 ? "disabled" : ""}>Previous</button><button type="button" data-ceremony="next">${ceremonyStep === slides.length - 1 ? "Finish" : "Reveal next"}</button>`;
        ceremonyLayer.hidden = false;
        if (slide.type === "award" && lastCelebratedStep !== ceremonyStep) {
          lastCelebratedStep = ceremonyStep;
          launchConfetti(slide.place);
        } else if (slide.type !== "award") confettiField.replaceChildren();
      }

      function finishCeremony() {
        ceremonyFinished = true;
        try { sessionStorage.setItem(`awards-finished:${code}`, "yes"); } catch {}
        closeCeremony();
        renderedSignature = "";
        if (lastGoodData) render(lastGoodData);
      }

      function closeCeremony() {
        ceremonyStep = -1;
        lastCelebratedStep = -1;
        ceremonySignature = "";
        confettiField.replaceChildren();
        ceremonyLayer.hidden = true;
      }

      ceremonyLayer.addEventListener("click", event => {
        const action = event.target.closest("[data-ceremony]")?.dataset.ceremony;
        if (!action) return;
        if (action === "exit") { closeCeremony(); return; }
        if (action === "previous") ceremonyStep = Math.max(0, ceremonyStep - 1);
        if (action === "next") {
          if (ceremonyStep >= ceremonySlides(lastGoodData).length - 1) { finishCeremony(); return; }
          ceremonyStep++;
        }
        renderCeremony();
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !settingsLayer.hidden) { settingsLayer.hidden = true; return; }
        if (ceremonyStep < 0) return;
        if (event.key === "Escape") closeCeremony();
        else if (event.key === "ArrowRight") { if (ceremonyStep >= ceremonySlides(lastGoodData).length - 1) finishCeremony(); else { ceremonyStep++; renderCeremony(); } }
        else if (event.key === "ArrowLeft") { ceremonyStep = Math.max(0, ceremonyStep - 1); renderCeremony(); }
      });

      function detailMetric(name, value, maximum, caption, note = "") {
        const width = percent(value, maximum);
        return `<div class="detail-metric"><div class="detail-metric-line"><span>${escapeHTML(name)}</span><strong>${escapeHTML(caption)}</strong></div><div class="entry-track"><div class="fill" style="width:${width.toFixed(2)}%"></div></div>${note ? `<small>${escapeHTML(note)}</small>` : ""}</div>`;
      }

      function renderDetail() {
        if (selectedEntryNumber === null || !lastGoodData || lastGoodData.judgingOpen) { closeDetail(); return; }
        const entry = lastGoodData.entries.find(item => String(item.number) === selectedEntryNumber);
        if (!entry || typeof entry.total !== "number") { closeDetail(); return; }
        const criteria = Array.isArray(entry.criteria) ? entry.criteria : [];
        const checklist = Array.isArray(entry.checklist) ? entry.checklist : [];
        const heading = lastGoodData.namesPublic && entry.name ? entry.name : entryText(entry);
        detailPanel.innerHTML = `<div class="detail-head"><div><p class="eyebrow">${entryLabel(entry)}</p><h2 id="detail-title">${escapeHTML(heading)}</h2></div><button type="button" class="detail-close" aria-label="Close details">Close</button></div>
          <div class="detail-summary"><strong>${entry.total.toFixed(1)} / 10</strong><span>${escapeHTML(entry.scoredBy)} judge${entry.scoredBy === 1 ? "" : "s"} scored this entry</span></div>
          <div class="detail-columns"><section><h3>Rating breakdown</h3>${criteria.length ? criteria.map(item => detailMetric(item.name, item.average, 10, `${Number(item.average).toFixed(1)} / 10`, `${item.judgeCount} judge${item.judgeCount === 1 ? "" : "s"} rated this criterion`)).join("") : `<p class="detail-empty">No criterion scores available.</p>`}</section>
          <section><h3>Quality checklist</h3>${checklist.length ? checklist.map(item => detailMetric(item.name, item.percent, 100, `${Number(item.percent).toFixed(1)}%`, `${item.checkedBy} of ${item.judgeCount} judges checked this`)).join("") : `<p class="detail-empty">No quality checklist for this competition.</p>`}</section></div>`;
        detailLayer.hidden = false;
      }

      function closeDetail() {
        if (detailLayer.hidden) return;
        detailLayer.hidden = true;
        selectedEntryNumber = null;
        previousFocus?.focus();
      }

      app.addEventListener("click", event => {
        if (event.target.closest(".display-button")) { settingsLayer.hidden = false; settingsLayer.querySelector("#settings-close")?.focus(); return; }
        if (event.target.closest(".ceremony-start") && lastGoodData && !lastGoodData.judgingOpen) {
          ceremonyStep = 0;
          renderCeremony();
          ceremonyControls.querySelector('[data-ceremony="next"]')?.focus();
          return;
        }
        const tab = event.target.closest(".category-tab[data-category]");
        if (tab && lastGoodData) {
          selectedCategory = tab.dataset.category;
          render(lastGoodData);
          [...app.querySelectorAll(".category-tab")].find(button => button.dataset.category === selectedCategory)?.focus();
          return;
        }
        const row = event.target.closest(".leader-row[data-entry]");
        if (!row || !lastGoodData || lastGoodData.judgingOpen) return;
        selectedEntryNumber = row.dataset.entry;
        previousFocus = row;
        renderDetail();
        detailPanel.querySelector(".detail-close")?.focus();
      });
      detailLayer.addEventListener("click", event => {
        if (event.target === detailLayer || event.target.closest(".detail-close")) closeDetail();
      });
      document.addEventListener("keydown", event => { if (event.key === "Escape") closeDetail(); });

      function applyPhotoTheme(photo) {
        // Sample only the existing cup image. Keep fixed dark/light values for contrast.
        try {
          const canvas = document.createElement("canvas");
          canvas.width = canvas.height = 24;
          const context = canvas.getContext("2d", { willReadFrequently: true });
          context.drawImage(photo, 0, 0, 24, 24);
          const pixels = context.getImageData(0, 0, 24, 24).data;
          let sine = 0, cosine = 0, weight = 0;
          for (let i = 0; i < pixels.length; i += 4) {
            const r = pixels[i] / 255, g = pixels[i + 1] / 255, b = pixels[i + 2] / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b), delta = max - min;
            const light = (max + min) / 2;
            if (delta < .12 || light < .12 || light > .9) continue;
            let hue = max === r ? ((g - b) / delta) % 6 : max === g ? (b - r) / delta + 2 : (r - g) / delta + 4;
            hue *= Math.PI / 3;
            const strength = delta * (1 - Math.abs(light - .5));
            sine += Math.sin(hue) * strength;
            cosine += Math.cos(hue) * strength;
            weight += strength;
          }
          if (weight < 3) return;
          const hue = Math.round((Math.atan2(sine, cosine) * 180 / Math.PI + 360) % 360);
          const root = document.documentElement.style;
          root.setProperty("--accent-hue", hue);
          root.setProperty("--bg", `hsl(${hue} 28% 6%)`);
          root.setProperty("--panel", `hsl(${hue} 28% 11% / .9)`);
          root.setProperty("--panel-2", `hsl(${hue} 29% 16% / .88)`);
          root.setProperty("--line", `hsl(${hue} 65% 75% / .2)`);
          root.setProperty("--green", `hsl(${hue} 78% 72%)`);
          root.setProperty("--green-2", `hsl(${hue} 62% 44%)`);
        } catch {
          // A missing image or unavailable canvas leaves the default theme intact.
        }
      }

      function initializeExtras(data) {
        const photo = document.getElementById("cup-photo");
        if (photo) {
          const showPhoto = () => { photo.classList.add("ready"); applyPhotoTheme(photo); };
          if (photo.complete && photo.naturalWidth) showPhoto();
          else photo.addEventListener("load", showPhoto, { once: true });
        }
        const qr = document.getElementById("qr");
        if (qr && window.QRCode) {
          new QRCode(qr, { text: `https://straindiary.com/c#${code}`, width: 76, height: 76, colorDark: "#07110d", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
        }
        document.title = `${data.title} | Strain Diary Live`;
      }

      function noteNewReviews(previous, current) {
        if (!previous?.judgingOpen || !current.judgingOpen) return;
        const previousCounts = new Map(previous.entries.map(entry => [String(entry.number), Number(entry.scoredBy) || 0]));
        const increased = current.entries.filter(entry =>
          previousCounts.has(String(entry.number)) && (Number(entry.scoredBy) || 0) > previousCounts.get(String(entry.number))
        );
        if (!increased.length) return;
        recentEntryNumbers = new Set(increased.map(entry => String(entry.number)));
        activityText = increased.length === 1
          ? `${entryText(increased[0])} just reviewed`
          : `${increased.length} entries just reviewed`;
        activityUntil = Date.now() + 8000;
        setTimeout(() => {
          if (Date.now() < activityUntil) return;
          document.getElementById("activity-toast")?.remove();
          document.querySelectorAll(".entry-card.just-reviewed").forEach(card => card.classList.remove("just-reviewed"));
        }, 8100);
      }

      function render(data) {
        const signature = JSON.stringify(data) + `|category:${selectedCategory || ""}|finished:${ceremonyFinished}`;
        if (signature === renderedSignature) {
          updateStatus();
          return;
        }
        renderedSignature = signature;
        app.innerHTML = data.judgingOpen ? renderOpen(data) : renderClosed(data);
        initializeExtras(data);
        if (selectedEntryNumber !== null) renderDetail();
        if (ceremonyStep >= 0) renderCeremony();
        updateStatus();
      }

      function updateStatus() {
        const countdown = document.getElementById("end-countdown");
        if (countdown && lastGoodData?.judgingEndsAt) {
          const remaining = Date.parse(lastGoodData.judgingEndsAt) - Date.now();
          if (remaining <= 0) countdown.textContent = "Judging ended · updating results…";
          else if (remaining < 3600000) {
            const seconds = Math.ceil(remaining / 1000);
            countdown.textContent = `Judging ends in ${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
          } else countdown.textContent = "";
        }
        const status = document.getElementById("live-status");
        const label = document.getElementById("updated-label");
        if (!status || !label) return;
        status.classList.toggle("reconnecting", reconnecting);
        if (reconnecting) {
          label.textContent = "reconnecting…";
          return;
        }
        const seconds = Math.max(0, Math.floor((Date.now() - lastGoodAt) / 1000));
        label.textContent = seconds < 2 ? "Updated just now" : `Updated ${seconds}s ago`;
      }

      async function refresh() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 12000);
        try {
          const endpoint = new URL(WORKER_URL);
          endpoint.searchParams.set("code", code);
          const response = await fetch(endpoint, { headers: { "Accept": "application/json" }, cache: "no-store", signal: controller.signal });
          if (response.status === 404 && !lastGoodData) {
            lastGoodData = null;
            showNotFound();
            return;
          }
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (!data || !Array.isArray(data.entries)) throw new Error("Invalid response");
          noteNewReviews(lastGoodData, data);
          lastGoodData = data;
          lastGoodAt = Date.now();
          reconnecting = false;
          render(data);
        } catch (error) {
          reconnecting = true;
          if (lastGoodData) render(lastGoodData);
          else showConnecting();
          updateStatus();
        } finally {
          clearTimeout(timeout);
        }
      }

      if (!/^[A-Z0-9]{4,8}$/.test(code)) {
        showNotFound();
        return;
      }

      refresh();
      timer = setInterval(refresh, REFRESH_MS);
      ageTimer = setInterval(updateStatus, 1000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refresh();
      });
      window.addEventListener("beforeunload", () => {
        clearInterval(timer);
        clearInterval(ageTimer);
      });
    })();
  </script>
</body>
</html>
