<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strain Reviews · Strain Diary</title>
<meta name="description" content="Strain reviews shared from Strain Diary, the private cannabis journal for iPhone.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="My strain reviews on Strain Diary">
<meta property="og:description" content="Tap any strain for the full review.">
<meta property="og:image" content="https://straindiary.com/assets/app-icon.png">
<link rel="icon" href="favicon.ico">
<style>
@font-face{font-family:Figtree;src:url(assets/figtree.woff2) format("woff2");font-weight:300 900;font-display:swap}
:root{--bg:#0a1710;--line:rgba(226,241,228,.13);--ink:#f3f4ed;--muted:#a8b8ad;--lime:#c8f06a}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(circle at 20% 0%,#1d3a29 0,transparent 55%),var(--bg);color:var(--ink);font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;padding:28px 16px calc(32px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:480px}
.head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:20px}
.avatar{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:36px;font-weight:900;background:linear-gradient(135deg,#7fd36b,#2a9d8f);color:#0c1711;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--lime)}
.head h1{margin:8px 0 0;font-size:24px;font-weight:900}
.head p{margin:0;color:var(--muted);font-size:14px;font-weight:600}
.tabs[hidden]{display:none}
.tabs{display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:700 14px Figtree,-apple-system,sans-serif;padding:10px 6px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--lime);color:#0c1711}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid var(--line);transition:transform .12s}
.item:active{transform:scale(.98)}
.dot{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:15px;color:#0c1711}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rate{font-weight:900;font-size:16px;color:#ffd66b;flex:none}
.chev{color:var(--muted);flex:none}
.empty,.msg{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.btn{display:flex;align-items:center;justify-content:center;height:52px;border-radius:999px;font-size:15px;font-weight:800;border:1px solid var(--line);background:rgba(255,255,255,.07)}
.btn.primary{background:var(--lime);color:#0c1711;border:0}
footer{margin-top:auto;padding-top:28px;font-size:12px;color:var(--muted);text-align:center}
footer a{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="avatar" id="avatar">S</div>
    <h1 id="name">Strain Diary</h1>
    <p id="handle"></p>
  </div>
  <div class="tabs" id="tabs" hidden></div>
  <div class="list" id="list"><div class="msg">Loading reviews…</div></div>
  <div class="actions">
    <a class="btn primary" href="https://testflight.apple.com/join/4TjvnXjD">Get Strain Diary free on TestFlight ↗</a>
    <a class="btn" href="/">What is Strain Diary?</a>
  </div>
</div>
<footer>Strain Diary · 21+ only · <a href="privacy-policy.html">Privacy</a></footer>
<script>
(function(){
  // Review pages come through a small Cloudflare Worker that keeps the
  // CloudKit token private and can only return review pages. Paste the
  // Worker's URL here (e.g. https://straindiary-reviews.NAME.workers.dev).
  var API_URL = "https://straindiaryreviews.gdgoehring.workers.dev";

  var id = location.hash.slice(1).trim();
  var list = document.getElementById("list");
  function msg(t){ list.innerHTML = ""; var d=document.createElement("div"); d.className="msg"; d.textContent=t; list.appendChild(d); }
  if (!id) { msg("This review page link is incomplete."); return; }

  var terpColors = {myrcene:"#7e57c2",limonene:"#f9c74f",caryophyllene:"#e76f51",linalool:"#8b7cf6",pinene:"#2a9d8f",humulene:"#a47148",terpinolene:"#4cc9f0",ocimene:"#90be6d",bisabolol:"#f4a3c1",nerolidol:"#8d99ae",farnesene:"#c8f06a"};
  function colorFor(name){
    var n = (name||"").toLowerCase();
    for (var k in terpColors) if (n.indexOf(k) >= 0) return terpColors[k];
    return "#7fd36b";
  }
  function decode(code){
    var s = code.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function el(tag, cls, text){ var n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n; }

  var page = null, current = null;
  var tabNames = {s:"Shared", g:"Global", d:"Diary"};

  function render(tab){
    current = tab;
    document.querySelectorAll("#tabs button").forEach(function(b){ b.classList.toggle("on", b.dataset.t === tab); });
    list.innerHTML = "";
    var items = page[tab] || [];
    if (!items.length) { msg("Nothing here yet."); return; }
    items.forEach(function(it){
      var p; try { p = decode(it.c); } catch(e) { return; }
      var a = el("a","item"); a.href = "/r#" + it.c;
      var tp = (p.tp && p.tp[0]) || (p.f && p.f[0]) || "";
      var dot = el("div","dot", (p.n||"?").trim().charAt(0).toUpperCase()); dot.style.background = colorFor(tp);
      var meta = el("div","meta"); meta.appendChild(el("b",null,p.n||"Strain"));
      var sub = [p.b, p.t, p.x].filter(Boolean).join(" · ");
      if (sub) meta.appendChild(el("span",null,sub));
      a.appendChild(dot); a.appendChild(meta);
      if (p.r > 0) a.appendChild(el("div","rate","★ " + Number(p.r).toFixed(1)));
      a.appendChild(el("div","chev","›"));
      list.appendChild(a);
    });
  }

  fetch(API_URL + "?id=" + encodeURIComponent(id))
    .then(function(r){ return r.json(); })
    .then(function(json){
      if (json.unverified) { msg("This review page couldn't be verified."); return; }
      page = json.page;
      if (!page) { msg("This review page isn't published right now."); return; }
      var handle = (page.h||"").replace(/^@/,"");
      document.getElementById("name").textContent = page.n || handle || "Strain Diary";
      document.getElementById("handle").textContent = handle ? "@" + handle + " on Strain Diary" : "";
      document.getElementById("avatar").textContent = (page.n || handle || "S").charAt(0).toUpperCase();
      document.title = (page.n || "@" + handle) + " · Strain Reviews";
      var tabs = (page.tabs || []).filter(function(t){ return tabNames[t]; });
      if (!tabs.length) { msg("Nothing here yet."); return; }
      var bar = document.getElementById("tabs");
      if (tabs.length > 1) {
        bar.hidden = false;
        tabs.forEach(function(t){
          var b = el("button", null, tabNames[t] + " · " + (page[t]||[]).length);
          b.dataset.t = t; b.onclick = function(){ render(t); };
          bar.appendChild(b);
        });
      }
      render(tabs[0]);
    })
    .catch(function(){ msg("Couldn't load reviews. Try again in a moment."); });
})();
</script>
</body>
</html>
